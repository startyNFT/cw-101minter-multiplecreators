[workspace]
members = ["contracts/minter", "contracts/collection"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
homepage = "https://github.com/startyNFT/cw-101minter-multiplecreators"
repository = "https://github.com/startyNFT/cw-101minter-multiplecreators"
license = "Apache-2.0"

[workspace.dependencies]
cosmwasm-schema = "2.2.1"
cosmwasm-std = { version = "2.2.1", features = ["cosmwasm_2_1"] }
cw2 = "2.0.0"
cw721 = "0.20.0"
cw721-base = "0.20.0"
cw-storage-plus = "2.0.0"
cw-utils = "2.0.0"
cw-ownable = "2.0.0"
schemars = "0.8.11"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0.31"
url = "2.2.2"

[profile.release]
rpath = false
lto = true
overflow-checks = true
opt-level = 3
debug = false
debug-assertions = false
