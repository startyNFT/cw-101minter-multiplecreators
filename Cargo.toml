[workspace]
members = ["contract"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
homepage = "https://github.com/yourorg/starty-multi-creator-minter"
repository = "https://github.com/yourorg/starty-multi-creator-minter"
license = "Apache-2.0"

[workspace.dependencies]
cosmwasm-schema = "1.5"
cosmwasm-std = { version = "1.5.10", features = ["cosmwasm_1_4"] }
cw2 = "1.1"
cw721 = "0.18"
cw721-base = "0.18"
cw-storage-plus = "1.2"
cw-utils = "1.0"
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0"
url = "2.5"

# Stargaze-specific dependencies from git
base-factory = { git = "https://github.com/public-awesome/launchpad", branch = "main" }
sg1 = { git = "https://github.com/public-awesome/launchpad", branch = "main" }
sg2 = { git = "https://github.com/public-awesome/launchpad", branch = "main" }
sg4 = { git = "https://github.com/public-awesome/launchpad", branch = "main" }
sg721 = { git = "https://github.com/public-awesome/launchpad", branch = "main" }
sg721-base = { git = "https://github.com/public-awesome/launchpad", branch = "main" }
sg-utils = { git = "https://github.com/public-awesome/launchpad", branch = "main" }
